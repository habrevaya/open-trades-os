# Netlify, for the web app and a once a minute worker tick.
#
# THIS FILE BELONGS AT apps/web/netlify.toml, with the netlify/ directory
# beside it at apps/web/netlify/. It lives here as a template so that a
# deployment that is not on Netlify is not carrying Netlify's configuration,
# and so that copying it is a decision rather than a default. README.md says
# how, and what runs where.
#
# In the Netlify UI, for this repository:
#
#   Base directory      (leave empty: the repository root, where the pnpm
#                        workspace and the lockfile are)
#   Package directory   apps/web
#
# Paths in this file are relative to the BASE directory, which is the root,
# even though the file itself sits in apps/web. That is Netlify's rule for
# monorepos and the most common way to get this file wrong.

[build]
  # Netlify runs `pnpm install` at the base directory first, because it finds
  # pnpm-lock.yaml there. Then this builds the one app that deploys. The
  # workspace packages ship TypeScript source and are compiled by Next as
  # part of this build, so there is nothing else to build first.
  command = "pnpm --filter @opentradesos/web build"
  publish = "apps/web/.next"

[build.environment]
  # The engines field in package.json says 22, and an older default fails on
  # syntax rather than with a message about versions.
  NODE_VERSION = "22"

[functions]
  # The worker tick's scheduler. Next.js's own server functions are generated
  # by Netlify's Next.js adapter during the build and need no entry here.
  directory = "apps/web/netlify/functions"
