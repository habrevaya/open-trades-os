name: CI

# Every push to the two long lived branches, and every pull request whatever
# it targets (feature branch -> develop -> main, so that includes both).
# Unrestricted on pull_request on purpose: a pull request into a feature
# branch is still code somebody is about to rely on.
on:
  push: { branches: [main, develop] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  # Tenant isolation, the SECURITY DEFINER boundaries and the ledger guards are
  # all invisible to the compiler, and all three are the kind of mistake that
  # ships quietly. They run against a real Postgres on every pull request
  # rather than nightly, because the failure mode is a cross tenant leak.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opentradesos
          POSTGRES_PASSWORD: opentradesos
          POSTGRES_DB: opentradesos
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://opentradesos:opentradesos@localhost:5432/opentradesos
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # The application role the tests assume. In production this is created by
      # the deployment; in CI we make it here so the isolation tests run as a
      # role that is actually subject to row level security. Testing as a
      # superuser proves nothing, because superusers bypass RLS entirely.
      - name: Create the application role
        run: psql "$DATABASE_URL" -c "create role authenticated;"

      - name: Migrate
        run: pnpm --filter @opentradesos/db migrate

      - name: Database tests
        run: pnpm --filter @opentradesos/db test

      # The service layer tests live here rather than in the unit job because
      # most of them need a real database. Run without one they do not fail,
      # they skip, and the job still reads green: forty three tenant isolation
      # and ledger tests can stop running without anyone noticing. The guard in
      # the test files turns that silence into a failure; this step is what
      # gives them the database they need.
      - name: Service layer tests
        run: pnpm --filter @opentradesos/api test

  # A browser, pressing the buttons.
  #
  # Render tests prove a screen draws and the selfhost job proves the server
  # boots. Neither ever submitted a form, and the first browser that did found
  # that nobody could sign up or sign in at all: hashing the password asked
  # scrypt for more memory than Node allows, on a path no other test runs.
  # This drives the seeded company through signup, booked to paid, the
  # customer's links, every back office screen and a technician's phone,
  # against a production build and a real Postgres.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opentradesos
          POSTGRES_PASSWORD: opentradesos
          POSTGRES_DB: opentradesos
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://opentradesos:opentradesos@localhost:5432/opentradesos
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # The same role the database job creates, for the same reason.
      - name: Create the application role
        run: psql "$DATABASE_URL" -c "create role authenticated;"

      - name: Build
        run: pnpm --filter @opentradesos/web build

      # The browser build this version of Playwright expects, and the system
      # libraries it needs. Here and nowhere else: a contributor's machine
      # uses whatever chromium it already has (see playwright.config.ts).
      - name: Install chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      # Migrates and seeds, then starts the production server itself.
      - name: Browser suite
        run: pnpm e2e

      - name: Keep the traces of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opentradesos/core test
      - run: pnpm --filter @opentradesos/trade-packs test
      # The offline queue. Crash recovery, restarts and dropped connections,
      # none of which need a device and all of which are miserable to
      # reproduce on one.
      - run: pnpm --filter @opentradesos/field-client test
      # Tailwind classes that do not exist. The silent failure in this stack:
      # no rule, no warning, no build error, just an unstyled element.
      - run: pnpm --filter web test

  # The self-host quickstart, actually run.
  #
  # `deploy/docker/docker-compose.yml` says its bar is that the file alone
  # gets somebody from a clone to a working login. It referenced two
  # Dockerfiles that did not exist, so `docker compose up` failed on the first
  # line, and nothing in this workflow noticed because nothing here had ever
  # opened it. A quickstart that does not start is worse than none: it is the
  # first thing a stranger tries and the reason they stop.
  selfhost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Step one of the documented quickstart, run rather than assumed.
      #
      # The compose file's own header says to do this first, and the first
      # version of this job skipped it and failed on a clean checkout with
      # "env file .env not found". That was a flaw in the test rather than in
      # the product: a job that claims to run the quickstart has to run all of
      # it, starting from what a stranger with a fresh clone actually has.
      - name: Configure, the way the quickstart says to
        run: cp .env.example .env

      # Parses the compose file and resolves every path in it, which is what
      # catches a service pointing at a file nobody wrote.
      - name: The compose file resolves
        run: docker compose -f deploy/docker/docker-compose.yml config > /dev/null

      # Built rather than linted. A Dockerfile that exists and does not build
      # fails in exactly the same place for the reader.
      - name: The web image builds
        run: docker build -f deploy/docker/Dockerfile.web -t ots-web:ci .

      - name: The worker image builds
        run: docker build -f deploy/docker/Dockerfile.worker -t ots-worker:ci .

      # And starts. An image that builds and cannot boot is the failure this
      # job exists for: the standalone output has to carry the workspace
      # packages, and when it does not, the build is clean and the container
      # exits immediately.
      - name: The web image starts and serves
        run: |
          docker run -d --name ots-web-ci -p 3000:3000 \
            -e DATABASE_URL=postgresql://nobody:nobody@127.0.0.1:5432/none \
            ots-web:ci
          for _ in $(seq 1 30); do
            # The sign in page needs no database, which is the point: this
            # checks the server booted, not that Postgres is reachable.
            if curl -sf -o /dev/null http://localhost:3000/login; then
              echo "served /login"; docker rm -f ots-web-ci; exit 0
            fi
            sleep 2
          done
          echo "never served a request"; docker logs ots-web-ci; exit 1
