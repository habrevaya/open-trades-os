name: Feature request
description: Something the product should do for a contractor that it does not yet
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    attributes:
      label: The problem
      description: What are you trying to get done, and what gets in the way today? Describe the job, not the button you want.
      placeholder: "When a customer calls to move an appointment, I have to..."
    validations: { required: true }
  - type: textarea
    attributes:
      label: What would solve it
      description: How you would like it to work. Rough is fine.
  - type: input
    attributes:
      label: Your trade and team size
      placeholder: "HVAC, 6 technicians"
  - type: textarea
    attributes:
      label: How you handle it now
      description: In Jobber, ServiceTitan, a spreadsheet, on paper. This tells us what has to be at least as good.
